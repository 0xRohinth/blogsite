            </a>
            <div class="flex items-center gap-4 text-sm font-mono">
                <a href="https://0xrohinth.github.io/" target="_blank" rel="noopener" class="text-slate-400 hover:text-cyan-400 transition-colors">./portfolio</a>

        <main class="py-8">

                    </div>

                    <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight mb-4 leading-tight">
                        <!-- POST_TITLE -->
                    </h1>

                    <div class="flex flex-wrap items-center justify-between gap-4 text-xs font-mono text-slate-400 pt-2">
                        <div class="flex items-center gap-2">
                            <span>PUBLISHED:</span>
                            <span class="text-cyan-400"><!-- POST_DATE --></span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <!-- POST_TAGS -->
                        </div>
                    </div>
                </header>

                <!-- CTF Machine Specs Box (if present) -->
                <!-- POST_SPECS -->

                <!-- Optional Hero Image -->
                <!-- HERO_IMAGE -->

        </footer>
    </div>

    <!-- Scripts for Code Copy & Lightbox -->
    <script>
        // Lightbox Functions
        function openLightbox(src) {
            const lightbox = document.getElementById('image-lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('image-lightbox').classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // Copy Code Button Handler
        function copyCode(button) {
            const wrapper = button.closest('.code-wrapper');
            const codeBlock = wrapper.querySelector('code');
            const textToCopy = codeBlock.innerText;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = button.innerText;
                button.innerText = 'COPIED!';
                button.style.backgroundColor = '#3fb950';
                button.style.color = '#0d1117';

                setTimeout(() => {
                    button.innerText = originalText;
                    button.style.backgroundColor = '';
                    button.style.color = '';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy code:', err);
            });
        }
    </script>
</body>
